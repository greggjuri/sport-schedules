<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Schedule | Juri Gregg</title>
    <meta name="description" content="Live schedule for NFL, college football, NHL, MLB, and the PGA Tour — with favorite teams highlighted.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Sports Schedule | Juri Gregg">
    <meta property="og:description" content="Live schedule for NFL, college football, NHL, MLB, and the PGA Tour — with favorite teams highlighted.">
    <meta property="og:url" content="https://jurigregg.com/sports">
    <meta property="og:image" content="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/sports/styles.css?v=2">
</head>
<body>
    <div class="wrap">
        <!-- HERO -->
        <header class="hero">
            <div class="hero-meta">
                <span class="live-dot"></span>
                <span id="metaDate">Live Schedule</span>
            </div>
            <h1>Sports<br><span class="accent">Schedule</span></h1>
            <p class="tagline">// Your fix for moderate to severe Sports Addiction</p>

            <nav class="filter-bar" aria-label="Sports filters">
                <div class="sport-pills" id="sportPills" role="tablist" aria-label="Filter by sport">
                    <button class="pill active" role="tab" aria-selected="true" data-sport="all">All</button>
                    <button class="pill" role="tab" aria-selected="false" data-sport="nfl">NFL</button>
                    <button class="pill" role="tab" aria-selected="false" data-sport="cfb">College FB</button>
                    <button class="pill" role="tab" aria-selected="false" data-sport="nhl">NHL</button>
                    <button class="pill" role="tab" aria-selected="false" data-sport="mlb">MLB</button>
                    <button class="pill" role="tab" aria-selected="false" data-sport="pga">PGA</button>
                </div>

                <label class="fav-toggle" id="favToggleWrap">
                    <span id="favLabel">Favorites Only</span>
                    <span class="switch on" id="favSwitch" role="switch" aria-checked="true" tabindex="0"></span>
                </label>
            </nav>
        </header>

        <!-- CONTENT -->
        <main id="sportsContent" aria-live="polite">
            <div class="loading">Loading<br></div>
        </main>
    </div>

    <script src="/sports/script.js?v=2"></script>
</body>
</html>
